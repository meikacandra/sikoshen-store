services:
  - type: web
    name: sikoshen-stock-planner
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SIKOSHEN_COOKIE_SECURE
        value: "true"
      - key: SIKOSHEN_OWNER_EMAIL
        value: "owner@sikoshen.id"
      # Jangan tulis kata sandi di file ini (repository bisa dibaca orang lain).
      # sync: false -> Render meminta nilainya diisi di dashboard saat membuat layanan.
      - key: SIKOSHEN_OWNER_PASSWORD
        sync: false
